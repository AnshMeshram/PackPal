<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <!-- PackPal Brand Logo with Wordmark -->
  <g transform="translate(10, 10)">
    <!-- Suitcase Body -->
    <rect x="5" y="18" width="50" height="40" rx="8" fill="#0C4137" />
    <rect x="5" y="18" width="50" height="40" rx="8" stroke="#06D6A0" stroke-width="2.5" />
    <!-- Handle -->
    <path d="M22 18 V11 C22 8 26 6 30 6 C34 6 38 8 38 11 V18" stroke="#0C4137" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M24 18 V12 C24 10 27 8 30 8 C33 8 36 10 36 12 V18" stroke="#06D6A0" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- Straps -->
    <line x1="18" y1="18" x2="18" y2="58" stroke="#06D6A0" stroke-width="2" stroke-dasharray="3 3" opacity="0.6" />
    <line x1="42" y1="18" x2="42" y2="58" stroke="#06D6A0" stroke-width="2" stroke-dasharray="3 3" opacity="0.6" />
    <!-- Central Location Pin with Checkmark -->
    <circle cx="30" cy="36" r="10" fill="#06D6A0" />
    <path d="M26 36 L29 39 L35 33" stroke="#0C4137" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <!-- Wordmark -->
  <text x="78" y="50" font-family="'DM Serif Display', Georgia, serif" font-size="34" font-weight="700" fill="#0C4137" letter-spacing="-0.5">Pack<tspan fill="#06D6A0">Pal</tspan></text>
  <text x="79" y="65" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#2BBAA5" letter-spacing="2" text-transform="uppercase">TRAVEL COMPANION</text>
</svg>
