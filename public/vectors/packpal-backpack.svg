<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Mint Green Circular Emblem Background -->
  <circle cx="256" cy="256" r="256" fill="#80D3A6" />

  <!-- Top Handle -->
  <path
    d="M216 85 C216 62 296 62 296 85"
    stroke="#453E3B"
    stroke-width="18"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Side Pockets Base -->
  <!-- Left Side Pocket -->
  <rect x="108" y="296" width="30" height="120" rx="14" fill="#D38A56" />
  <rect x="108" y="258" width="30" height="48" rx="8" fill="#50A073" />
  <circle cx="104" cy="300" r="6" fill="#7D473A" />
  <path d="M104 300 C96 312 96 324 100 334" stroke="#DF8A52" stroke-width="5" stroke-linecap="round" fill="none" />

  <!-- Right Side Pocket -->
  <rect x="374" y="296" width="30" height="120" rx="14" fill="#D38A56" />
  <rect x="374" y="258" width="30" height="48" rx="8" fill="#50A073" />
  <circle cx="408" cy="300" r="6" fill="#7D473A" />
  <path d="M408 300 C416 312 416 324 412 334" stroke="#DF8A52" stroke-width="5" stroke-linecap="round" fill="none" />

  <!-- Main Backpack Canvas Body -->
  <path
    d="M136 210 C136 120 376 120 376 210 L376 400 C376 432 344 436 320 436 L192 436 C168 436 136 432 136 400 Z"
    fill="#DCB686"
  />

  <!-- Top Forest Green Hood / Flap -->
  <path
    d="M136 192 C146 100 366 100 376 192 L376 194 C340 194 172 194 136 194 Z"
    fill="#50A073"
  />

  <!-- Top Hood Zipper -->
  <line x1="226" y1="152" x2="288" y2="152" stroke="#453E3B" stroke-width="3" stroke-linecap="round" />
  <rect x="222" y="152" width="7" height="13" rx="2" fill="#453E3B" />
  <circle cx="225" cy="158" r="1.5" fill="#FFFFFF" />

  <!-- Small left hanging pull tab -->
  <circle cx="148" cy="152" r="3" fill="#453E3B" />
  <rect x="144" y="152" width="6" height="12" rx="2" fill="#453E3B" transform="rotate(30 147 158)" />

  <!-- Vertical Backpack Harness Straps -->
  <!-- Left Strap -->
  <rect x="188" y="82" width="19" height="152" rx="3" fill="#453E3B" />
  <!-- Left Strap Buckle Clasp -->
  <rect x="180" y="230" width="36" height="24" rx="7" fill="#EAA41A" />
  <path d="M188 254 C188 270 207 270 207 254 Z" fill="#453E3B" />

  <!-- Right Strap -->
  <rect x="303" y="82" width="19" height="152" rx="3" fill="#453E3B" />
  <!-- Right Strap Buckle Clasp -->
  <rect x="296" y="230" width="36" height="24" rx="7" fill="#EAA41A" />
  <path d="M303 254 C303 270 322 270 322 254 Z" fill="#453E3B" />

  <!-- Front Pocket Upper (Caramel Leather) -->
  <rect x="175" y="274" width="162" height="106" rx="22" fill="#BA794E" />

  <!-- Front Pocket Horizontal Zipper -->
  <line x1="185" y1="310" x2="328" y2="310" stroke="#453E3B" stroke-width="4.5" stroke-linecap="round" />
  <rect x="184" y="310" width="15" height="26" rx="4" fill="#453E3B" />
  <circle cx="191.5" cy="318" r="3" fill="#FFFFFF" />

  <!-- Front Pocket Lower Flap (Dark Mahogany) -->
  <rect x="175" y="370" width="162" height="42" rx="14" fill="#7D473A" />

  <!-- Lower Pocket Buckle/Label Accent -->
  <rect x="235" y="378" width="42" height="23" rx="5" fill="#EAA41A" />
  <rect x="245" y="384" width="22" height="11" rx="2" fill="#FFFFFF" />
</svg>
