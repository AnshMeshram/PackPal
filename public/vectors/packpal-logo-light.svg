<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <!-- PackPal Light Logo for Dark Surfaces -->
  <g transform="translate(10, 10)">
    <!-- Suitcase Body -->
    <rect x="5" y="18" width="50" height="40" rx="8" fill="#E6FBF6" />
    <rect x="5" y="18" width="50" height="40" rx="8" stroke="#06D6A0" stroke-width="2" />
    <!-- Handle -->
    <path d="M22 18 V11 C22 8 26 6 30 6 C34 6 38 8 38 11 V18" stroke="#06D6A0" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <!-- Center Check -->
    <circle cx="30" cy="38" r="10" fill="#0C4137" />
    <path d="M26 38 L29 41 L35 35" stroke="#06D6A0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <!-- Wordmark -->
  <text x="78" y="50" font-family="'DM Serif Display', Georgia, serif" font-size="34" font-weight="700" fill="#FFFFFF" letter-spacing="-0.5">Pack<tspan fill="#06D6A0">Pal</tspan></text>
  <text x="79" y="65" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#93D3AE" letter-spacing="2" text-transform="uppercase">TRAVEL COMPANION</text>
</svg>
